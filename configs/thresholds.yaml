# Configurable parking-classification thresholds (tune on validation set)
# Initial engineering values from project requirements — not universal truths.

# Tuned on validation (see outputs/tuning/threshold_search.json). Test set unused.
vehicle_inside_min: 0.85          # min R_vehicle for CORRECT PARKING
likely_correct_min_inside_ratio: 0.50 # higher-recall blue classification when assigned to one slot without a straddle
outside_max: 0.10                 # max R_outside for CORRECT PARKING
wrong_parking_min_outside_ratio: 0.70 # require at least 70% estimated outside area before calling a single-slot violation
slot_assign_min: 0.30             # min R_vehicle to assign car to a slot
minimum_second_slot_intrusion_ratio: 0.20  # vehicle area beyond primary slot tolerance required to flag a slot straddle
minimum_vehicle_slot_size_ratio_for_straddle: 1.50  # ignore slot-boundary splits when the car fits one slot
minimum_second_slot_overlap_ratio: 0.50   # require very substantial overlap for learned-box fallback
vehicle_straddle_min_aspect_ratio: 1.80    # restrict fallback to strongly elongated horizontal vehicles
boundary_crossing_tolerance: 0.05 # ignore intrusion within 5% of the vehicle's short dimension
slot_coverage_occupied_min: 0.30  # min R_slot for physical occupancy
usable_free_max_intrusion: 0.05   # max intrusion for usable availability

# Keep weak vehicle detections visible as uncertain instead of dropping them.
vehicle_detection_conf_min: 0.10
vehicle_conf_min: 0.25
slot_conf_min: 0.25
uncertain_conf_max: 0.40          # below this (but above conf_min): UNCERTAIN
nms_iou: 0.45
vehicle_tile_size: 256
slot_tile_size: 256
inference_tile_overlap: 0.2
tile_edge_margin_ratio: 0.04
# Prefer one high-resolution full-frame pass; tiling can be enabled for small targets.
vehicle_imgsz: 1280
slot_imgsz: 640
tiled_inference: false

# Temporal smoothing (video)
temporal_window: 5
temporal_majority: 0.6
